<svg xmlns="http://www.w3.org/2000/svg" width="1688" height="862" viewBox="0 0 1688 862" role="img" aria-labelledby="t d">
  <title id="t">APDU Sender</title>
  <desc id="d">An NFC phone sends APDU commands to EMV, Apple VAS, Google Smart Tap, MIFARE, FeliCa and Java Card cards, with a decoded response console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d1f"/><stop offset="1" stop-color="#12245a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e7eb"/><stop offset="1" stop-color="#9ca3af"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace}
    </style>
  </defs>

  <rect width="1688" height="862" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".04">
    <path d="M0 120H1688M0 240H1688M0 360H1688M0 480H1688M0 600H1688M0 720H1688"/>
    <path d="M140 0V862M280 0V862M420 0V862M560 0V862M700 0V862M840 0V862M980 0V862M1120 0V862M1260 0V862M1400 0V862M1540 0V862"/>
  </g>

  <!-- Title -->
  <text x="90" y="120" fill="#fff" font-size="64" font-weight="700">APDU Sender</text>
  <text x="90" y="170" fill="#93a4cf" font-size="26">Turn an NFC phone into a contactless reader for card testing</text>
  <rect x="90" y="190" width="120" height="6" rx="3" fill="url(#accent)"/>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="130" y="250" width="300" height="560" rx="44" fill="#0b1738" stroke="#2b4180" stroke-width="3"/>
    <rect x="148" y="268" width="264" height="524" rx="32" fill="#060d1f"/>
    <rect x="240" y="278" width="80" height="14" rx="7" fill="#1a2d5e"/>
    <text x="170" y="336" fill="#fff" font-size="22" font-weight="600">APDU Sender</text>
    <rect x="170" y="356" width="220" height="44" rx="10" fill="#0f1d45" stroke="#2b4180"/>
    <text x="184" y="384" class="mono" fill="#38bdf8" font-size="15">00A4040007A0000000041010</text>
    <rect x="170" y="416" width="220" height="44" rx="12" fill="url(#accent)"/>
    <text x="280" y="445" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Send</text>
    <g class="mono" font-size="14" fill="#93a4cf">
      <text x="170" y="500">&gt; 00 A4 04 00 0E ...</text>
      <text x="170" y="526" fill="#34d399">&lt; 6F 20 84 0E ... 90 00</text>
      <text x="170" y="552">&gt; 80 CA 9F 7F 00</text>
      <text x="170" y="578" fill="#34d399">&lt; 9F 7F 2A ... 90 00</text>
    </g>
    <!-- NFC icon -->
    <g transform="translate(280 690)" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round">
      <path d="M-30 -30Q-8 0 -30 30" opacity=".5"/>
      <path d="M-12 -44Q22 0 -12 44" opacity=".75"/>
      <path d="M8 -58Q52 0 8 58"/>
    </g>
  </g>

  <!-- NFC waves from phone to cards -->
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M470 430Q500 530 470 630" opacity=".35"/>
    <path d="M505 400Q550 530 505 660" opacity=".6"/>
    <path d="M540 370Q600 530 540 690"/>
  </g>

  <!-- Console -->
  <g filter="url(#shadow)">
    <rect x="640" y="250" width="440" height="560" rx="22" fill="#0a1329" stroke="#2b4180" stroke-width="2"/>
    <path d="M640 272a22 22 0 0 1 22-22h396a22 22 0 0 1 22 22v38H640z" fill="#0f1d45"/>
    <circle cx="672" cy="280" r="7" fill="#f87171"/><circle cx="696" cy="280" r="7" fill="#fbbf24"/><circle cx="720" cy="280" r="7" fill="#34d399"/>
    <text x="860" y="286" fill="#93a4cf" font-size="16" text-anchor="middle">SELECT PPSE</text>
    <g class="mono" font-size="17">
      <text x="668" y="352" fill="#38bdf8">C-APDU</text>
      <text x="668" y="382" fill="#e2e8f0">00 A4 04 00 0E 32 50 41 59</text>
      <text x="668" y="408" fill="#e2e8f0">2E 53 59 53 2E 44 44 46 30 31 00</text>
      <text x="668" y="462" fill="#34d399">R-APDU  SW=9000</text>
      <text x="668" y="492" fill="#e2e8f0">6F 20 84 0E 32 50 41 59 2E 53</text>
      <text x="668" y="518" fill="#e2e8f0">59 53 2E 44 44 46 30 31 A5 0E</text>
      <text x="668" y="544" fill="#e2e8f0">BF 0C 0B 61 09 4F 07 A0 00 00</text>
      <text x="668" y="570" fill="#e2e8f0">00 04 10 10 90 00</text>
    </g>
    <line x1="668" y1="596" x2="1052" y2="596" stroke="#18274a"/>
    <g class="mono" font-size="16">
      <text x="668" y="632" fill="#fbbf24">6F</text><text x="708" y="632" fill="#93a4cf">FCI Template</text>
      <text x="688" y="662" fill="#fbbf24">84</text><text x="728" y="662" fill="#93a4cf">DF Name: 2PAY.SYS.DDF01</text>
      <text x="688" y="692" fill="#fbbf24">A5</text><text x="728" y="692" fill="#93a4cf">FCI Proprietary</text>
      <text x="708" y="722" fill="#fbbf24">BF0C</text><text x="768" y="722" fill="#93a4cf">Issuer Discretionary</text>
      <text x="728" y="752" fill="#fbbf24">4F</text><text x="768" y="752" fill="#93a4cf">AID A0000000041010</text>
    </g>
  </g>

  <!-- Card stack -->
  <g transform="translate(1160 0)">
    <g transform="translate(0 250) rotate(-6 100 60)" filter="url(#shadow)">
      <rect width="400" height="130" rx="18" fill="url(#card1)"/>
      <rect x="28" y="30" width="46" height="36" rx="7" fill="#fde68a" opacity=".9"/>
      <text x="28" y="104" fill="#fff" font-size="24" font-weight="700">EMV</text>
      <text x="372" y="104" fill="#fff" fill-opacity=".85" font-size="16" text-anchor="end">Visa · Mastercard · AMEX</text>
    </g>
    <g transform="translate(20 405)" filter="url(#shadow)">
      <rect width="400" height="130" rx="18" fill="url(#card2)"/>
      <text x="28" y="48" fill="#111827" font-size="24" font-weight="700">Apple VAS</text>
      <text x="28" y="84" fill="#374151" font-size="17">Value Added Services pass</text>
      <text x="28" y="108" fill="#374151" font-size="17">Google Smart Tap</text>
    </g>
    <g transform="translate(0 560) rotate(4 100 60)" filter="url(#shadow)">
      <rect width="400" height="130" rx="18" fill="url(#card3)"/>
      <text x="28" y="48" fill="#fff" font-size="24" font-weight="700">Transit · Access</text>
      <text x="28" y="84" fill="#ecfdf5" font-size="17">MIFARE · FeliCa</text>
      <text x="28" y="108" fill="#ecfdf5" font-size="17">Java Card applets</text>
    </g>
  </g>

  <!-- Chips -->
  <g font-size="18" font-weight="600" fill="#cbd5f5">
    <rect x="1160" y="716" width="130" height="40" rx="20" fill="#0f1d45" stroke="#2b4180"/><text x="1225" y="742" text-anchor="middle">ISO 7816</text>
    <rect x="1304" y="716" width="130" height="40" rx="20" fill="#0f1d45" stroke="#2b4180"/><text x="1369" y="742" text-anchor="middle">ISO 14443</text>
    <rect x="1448" y="716" width="140" height="40" rx="20" fill="#0f1d45" stroke="#2b4180"/><text x="1518" y="742" text-anchor="middle">Android 10+</text>
  </g>
</svg>
