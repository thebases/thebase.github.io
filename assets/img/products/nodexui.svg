<g filter="url(#shadow)"><rect x="90" y="250" width="620" height="540" rx="20" fill="#0b1220" stroke="#cbd5e1"/><path d="M90 270a20 20 0 0 1 20-20h580a20 20 0 0 1 20 20v28H90z" fill="#111c33"/><circle cx="118" cy="274" r="7" fill="#f87171"/><circle cx="142" cy="274" r="7" fill="#fbbf24"/><circle cx="166" cy="274" r="7" fill="#34d399"/><text x="400.0" y="280" fill="#94a3b8" font-size="16" text-anchor="middle">index.html</text></g><text class="m" x="120" y="338" fill="#64748b" font-size="19">&lt;!-- no build step --&gt;</text><text class="m" x="120" y="372" fill="#38bdf8" font-size="19">&lt;link rel="stylesheet"</text><text class="m" x="120" y="406" fill="#e2e8f0" font-size="19">  href="nodexui.min.css"&gt;</text><text class="m" x="120" y="440" fill="#38bdf8" font-size="19">&lt;script src="nodexui.min.js"&gt;</text><text class="m" x="120" y="474" fill="#38bdf8" font-size="19">&lt;/script&gt;</text><text class="m" x="120" y="542" fill="#a78bfa" font-size="19">&lt;b-ui button primary&gt;</text><text class="m" x="120" y="576" fill="#e2e8f0" font-size="19">  Save changes</text><text class="m" x="120" y="610" fill="#a78bfa" font-size="19">&lt;/b-ui&gt;</text><text class="m" x="120" y="678" fill="#a78bfa" font-size="19">&lt;b-icon name="check"/&gt;</text><text class="m" x="120" y="712" fill="#a78bfa" font-size="19">&lt;b-ui switch checked/&gt;</text><rect x="120" y="740" width="320" height="34" rx="8" fill="#111c33"/><text class="m" x="136" y="763" fill="#34d399" font-size="18">$ npm i nodexui</text><g filter="url(#shadow)"><rect x="790" y="250" width="800" height="540" rx="24" fill="#fff" stroke="#cbd5e1"/></g><text x="830" y="306" fill="#0f172a" font-size="26" font-weight="700">Components</text><rect x="830" y="336" width="150" height="52" rx="12" fill="url(#accent)"/><text x="905" y="370" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Primary</text><rect x="1000" y="336" width="150" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1075" y="370" fill="#0f172a" font-size="20" font-weight="600" text-anchor="middle">Outline</text><rect x="1170" y="336" width="150" height="52" rx="12" fill="#0f172a"/><text x="1245" y="370" fill="#fff" font-size="20" font-weight="600" text-anchor="middle">Dark</text><rect x="830" y="416" width="360" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="850" y="450" fill="#94a3b8" font-size="19">Search components…</text><rect x="1220" y="426" width="76" height="40" rx="20" fill="#6366f1"/><circle cx="1276" cy="446" r="15" fill="#fff"/><rect x="1316" y="426" width="76" height="40" rx="20" fill="#e2e8f0"/><circle cx="1336" cy="446" r="15" fill="#fff" stroke="#cbd5e1"/><g font-size="20" font-weight="600"><text x="830" y="522" fill="#6366f1">Overview</text><rect x="830" y="534" width="100" height="4" rx="2" fill="#6366f1"/><text x="970" y="522" fill="#64748b">Forms</text><text x="1070" y="522" fill="#64748b">Tables</text><text x="1180" y="522" fill="#64748b">Dialogs</text></g><line x1="830" y1="538" x2="1550" y2="538" stroke="#e2e8f0"/><rect x="830" y="570" width="220" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="848" y="588" width="44" height="44" rx="12" fill="#38bdf8"/><text x="848" y="670" fill="#0f172a" font-size="22" font-weight="700">Card</text><rect x="848" y="688" width="150" height="8" rx="4" fill="#cbd5e1"/><rect x="848" y="704" width="100" height="8" rx="4" fill="#e2e8f0"/><rect x="1070" y="570" width="220" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="1088" y="588" width="44" height="44" rx="12" fill="#6366f1"/><text x="1088" y="670" fill="#0f172a" font-size="22" font-weight="700">Modal</text><rect x="1088" y="688" width="150" height="8" rx="4" fill="#cbd5e1"/><rect x="1088" y="704" width="100" height="8" rx="4" fill="#e2e8f0"/><rect x="1310" y="570" width="220" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><rect x="1328" y="588" width="44" height="44" rx="12" fill="#34d399"/><text x="13